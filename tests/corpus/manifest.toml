# Corpus manifest. Every markdown construct and byte-level property the
# round-trip harness must preserve is listed here with the files exercising
# it. The coverage test in crates/skribeum-core/tests/corpus_coverage.rs
# fails if a construct has no files, a listed file is missing, or a corpus
# file is listed under no construct.
#
# All content in this directory is synthesized for testing and dedicated to
# the public domain under CC0 1.0; see LICENSE in this directory.
#
# File names containing combining characters are written with TOML escape
# sequences so no editor can silently normalize them: one name contains
# NFC U+00E9, the other NFD U+0065 U+0301.

[[construct]]
key = "headings-atx"
description = "ATX headings, levels one through six, open and closed forms"
files = ["headings-atx-setext.md"]

[[construct]]
key = "headings-setext"
description = "Setext headings with equals and hyphen underlines"
files = ["headings-atx-setext.md"]

