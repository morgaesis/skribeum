[package]
name = "skribeum-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
skribeum-core = { path = "../crates/skribeum-core" }
skribeum-vault = { path = "../crates/skribeum-vault" }

[[bin]]
name = "vault_path"
path = "fuzz_targets/vault_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "offset_conversion"
path = "fuzz_targets/offset_conversion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoding_classify"
path = "fuzz_targets/encoding_classify.rs"
test = false
doc = false
bench = false
