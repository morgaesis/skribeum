# cargo-deny configuration. Checked in CI and locally via `cargo deny check`.

[graph]
# Include feature-gated dependencies (the webdriver test feature) in the checks.
all-features = true

[advisories]
yanked = "deny"
# The gtk3 and unic advisory groups flag unmaintained transitive dependencies
# of the Tauri ecosystem itself. Only direct workspace dependencies are held
# to the unmaintained standard.
unmaintained = "workspace"
# Unsound advisories fail regardless of whether the affected crate is direct
# or transitive. Vulnerability advisories fail at every dependency depth by
# cargo-deny's default policy.
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Tauri 2.11.5's Linux GTK 3 stack requires the glib 0.18 family" },
]
# An exception that no longer matches the resolved graph must be removed.
unused-ignored-advisory = "deny"

[licenses]
# MPL-2.0 is required by cssparser, dtoa-short, and option-ext, all transitive
# dependencies of tauri-utils. MPL-2.0 is file-level copyleft and imposes no
# obligations on this codebase.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # CC0-1.0 is a public-domain dedication, required by notify.
  "CC0-1.0",
  # CDLA-Permissive-2.0 covers the Mozilla certificate authority data the
  # updater's TLS stack embeds. It is a permissive data license with no
  # obligations on this codebase.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Workspace path dependencies carry no version and are not wildcards in the
# problematic sense.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
