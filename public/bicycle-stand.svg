<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Flat illustration of a bicycle held in a repair stand, with a floor pump beside it">
  <rect width="320" height="200" fill="#f4f1ea"/>

  <!-- Floor -->
  <rect x="0" y="176" width="320" height="4" fill="#c9c2af"/>

  <!-- Repair stand: base, pole, clamp -->
  <rect x="130" y="176" width="60" height="6" rx="2" fill="#5c5744"/>
  <rect x="157" y="50" width="6" height="126" fill="#5c5744"/>
  <path d="M154 50 L166 50 L172 66 L148 66 Z" fill="#5c5744"/>

  <!-- Rear and front wheels -->
  <circle cx="110" cy="150" r="34" fill="none" stroke="#2a2a2a" stroke-width="5"/>
  <circle cx="110" cy="150" r="5" fill="#2a2a2a"/>
  <circle cx="210" cy="150" r="34" fill="none" stroke="#2a2a2a" stroke-width="5"/>
  <circle cx="210" cy="150" r="5" fill="#2a2a2a"/>

  <!-- Frame -->
  <path d="M110 150 L160 90 L210 150 M160 90 L150 150 M160 90 L182 90 L210 150" fill="none" stroke="#2f6d4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Seat post and saddle -->
  <path d="M150 150 L142 96" fill="none" stroke="#2f6d4f" stroke-width="5" stroke-linecap="round"/>
  <rect x="126" y="90" width="24" height="7" rx="3" fill="#2a2a2a"/>
  <!-- Handlebar -->
  <path d="M182 90 L182 70" fill="none" stroke="#2f6d4f" stroke-width="5" stroke-linecap="round"/>
  <rect x="168" y="64" width="34" height="6" rx="3" fill="#2a2a2a"/>

  <!-- Floor pump beside the stand -->
  <rect x="252" y="70" width="6" height="100" rx="2" fill="#8a6a3f"/>
  <rect x="238" y="164" width="34" height="8" rx="3" fill="#8a6a3f"/>
  <rect x="246" y="60" width="22" height="12" rx="3" fill="#8a6a3f"/>
</svg>
