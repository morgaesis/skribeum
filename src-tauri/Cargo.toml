[package]
name = "skribeum-app"
description = "Skribeum desktop shell. Tauri glue only; logic lives in the core crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "skribeum_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
skribeum-core = { path = "../crates/skribeum-core" }
skribeum-vault = { path = "../crates/skribeum-vault" }
tauri = { version = "2.11.5", features = ["specta"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
# The paired release candidates share generated type contracts and move
# together after their integration tests pass.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2.5.4"

# Native Maximize-button hit-testing and the real system window menu
# (design system section 4.13) are Windows-only; this pins the same version
# Tauri itself already resolves transitively (see Cargo.lock), so declaring
# it directly adds no new supply-chain surface.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

# The webdriver feature embeds a WebDriver server for end-to-end tests.
# It is enabled only by the e2e build and never in release artifacts.
[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
