[workspace]
resolver = "2"
members = [
  "crates/skribeum-core",
  "crates/skribeum-import",
  "crates/skribeum-vault",
  "src-tauri",
]
# The fuzz crate builds on its own pinned nightly (cargo-fuzz requires it);
# keeping it outside the workspace keeps every other build on exact stable.
exclude = ["fuzz"]

[workspace.dependencies]
# RUSTSEC-2024-0429 is blocked by Tauri 2's Linux GTK 3 stack. Tauri 2.11.5,
# webkit2gtk 2.0.2, and muda 0.19.3 require gtk and glib 0.18. Dependency
# refreshes must recheck this chain before retaining glib below 0.20.

[workspace.package]
version = "0.0.11"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morgaesis/skribeum"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
