name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    # `labeled` is in the list so that adding `full-matrix` to an open pull
    # request starts a run that reads it; the platform selection below comes
    # from the event payload, which a re-run of an earlier event would not
    # carry.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

# A superseded push to the same branch cancels the in-flight run: only the
# newest head's result matters on a pull request. Runs on main always
# complete, since each merge's result is the record of what landed, and main
# is the only place the full platform matrix runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  LINUX_WEBKIT_PACKAGES: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
    libayatana-appindicator3-dev libssl-dev patchelf

jobs:
  # The platform matrix is a function of the event. A pull request runs one
  # Linux leg on an arm runner, which is what makes its wall clock roughly
  # the length of a single Linux job instead of the slowest of four
  # platforms. A push to main runs all four, so the platform-specific result
  # still exists for every commit that lands, just after the merge rather
  # than before it. A pull request labelled `full-matrix` opts back in to all
  # four, for a change that touches platform-specific behaviour.
  #
  # The arm class is in the main list for the cache, not only for coverage.
  # The Rust cache key includes the runner architecture, and entries are
  # written only from pushes to main, so a class that never runs on main
  # never has an entry written and every pull request on it compiles cold.
  # Dropping ubuntu-24.04-arm here would make the pull-request leg slower
  # than the three-platform matrix it replaces, and it would read as arm
  # being slow rather than as a cache that was never populated.
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Select platforms for this event
        id: select
        env:
          FULL_MATRIX: >-
            ${{ github.event_name != 'pull_request'
            || contains(github.event.pull_request.labels.*.name, 'full-matrix') }}
        run: |
          set -euo pipefail
          if [ "$FULL_MATRIX" = true ]; then
            platforms='["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]'
          else
            platforms='["ubuntu-24.04-arm"]'
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Platform matrix: $platforms" >> "$GITHUB_STEP_SUMMARY"

  release-metadata:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python3 .github/scripts/test-build-manifest.py

      - run: python3 .github/scripts/test-release-notes.py

  rust:
    name: rust (${{ matrix.os }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install webkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_WEBKIT_PACKAGES }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx biome check .

      - run: bun run check

      # Component-level editor tests: offset-conversion and line-ending
      # parity with skribeum-core, cursor mapping and undo discipline
      # across external ingests, the decoration engine (snapshot goldens,
      # cursor-reveal rules, buffer inertness over the corpus, frontmatter
      # round trips, UI-string externalization), and the TypeScript half of
      # the two-parser conformance gate against tests/conformance/rust/.
      - run: bun run test:web

      # Data-driven decoration proof: a pull request changing the
      # decoration table may touch only the table file, tests, and
      # docs/decoration-rules.md.
      - run: bash scripts/check-table-only-diff.sh
        shell: bash
        if: runner.os == 'Linux'

      # The frontend must be built before any cargo compilation:
      # tauri::generate_context! embeds ../dist at compile time, so clippy and
      # the test build fail without it.
      - run: bun run build

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Restored on every event, written only from the default branch: an
      # entry saved from a pull request is scoped to that pull request's
      # merge ref, so nothing else can read it, and it duplicates the
      # default-branch entry under the same key. The condition is written
      # inline rather than through a workflow variable because the action
      # hashes every environment variable whose name begins with RUST,
      # CARGO, CC, CFLAGS, CXX or CMAKE into the cache key, and a variable
      # holding this condition would key pull requests apart from the
      # branch they need to restore from. See docs/ci.md.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Release artifacts compile with debug assertions off, which changes
      # which cfg-gated code exists; the debug-profile jobs cannot see a
      # release-only compile error.
      - run: cargo check --workspace --release --locked

      - run: cargo test --workspace --locked

      # Two-parser conformance gate (permanent): the Rust extractor and the
      # TypeScript decoration engine must produce identical
      # (kind, start_byte, end_byte) sets over tests/corpus/, per
      # tests/syntax-spec.toml. This step verifies the Rust emission against
      # the committed snapshots in tests/conformance/rust/; the TypeScript
      # emitter's comparison against the same snapshots runs in the web
      # test suite above.
      - name: Two-parser conformance gate
        run: cargo test -p skribeum-core --locked --test conformance

      # IPC contract gate: the tauri-specta generated bindings must expose
      # exactly the command set committed in ipc-allowlist.json, and the
      # committed src/lib/ipc/bindings.ts must match what the code generates.
      - name: IPC allowlist and bindings check
        run: cargo test -p skribeum-app --locked --test ipc_contract

  # The committed baselines are medians for the Linux x64 runner class, so the
  # comparison is only meaningful on that runner. It is its own job rather
  # than a step of the Linux `rust` leg because the Linux leg's architecture
  # varies with the event, and because the benchmark crates carry no Tauri
  # dependency and so need neither the webkit packages nor a frontend build.
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Restored on every event, written only from the default branch;
      # see the note on the same step in the rust job and docs/ci.md.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust benchmarks and compare baselines
        run: |
          cargo bench -p skribeum-core --bench parse_extract --locked -- --noplot
          cargo bench -p skribeum-vault --bench vault_operations --locked -- --noplot
          bun scripts/compare-benchmarks.ts \
            --baseline crates/skribeum-core/benches/baselines/core.json \
            --criterion-dir target/criterion
          bun scripts/compare-benchmarks.ts \
            --baseline crates/skribeum-vault/benches/baselines/vault.json \
            --criterion-dir target/criterion

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_WEBKIT_PACKAGES }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.95 --profile minimal

      # Restored on every event, written only from the default branch;
      # see the note on the same step in the rust job and docs/ci.md.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml so the build runs on
      # the minimum supported version declared in Cargo.toml.
      - run: cargo build --workspace --locked
        env:
          RUSTUP_TOOLCHAIN: "1.95"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the whole commit range is scanned, not just HEAD.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - run: gitleaks detect --redact --source .

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  javascript-audit:
    name: JavaScript audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run audit

  e2e:
    name: e2e (${{ matrix.os }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install webkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_WEBKIT_PACKAGES }} xvfb

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Restored on every event, written only from the default branch;
      # see the note on the same step in the rust job and docs/ci.md.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The webdriver feature compiles the embedded WebDriver server into the
      # debug binary; the @wdio/tauri-service embedded provider connects to it
      # directly, so no external tauri-driver is needed on any platform.
      - name: Build debug app
        # The touch defeats the build cache for the shell crate: the config
        # overlay is embedded at macro expansion, which a warm cache skips,
        # silently shipping a binary without withGlobalTauri.
        run: |
          touch src-tauri/build.rs src-tauri/src/lib.rs
          bun tauri build --debug --no-bundle --features webdriver --config src-tauri/tauri.webdriver.conf.json

      - name: Run smoke test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run e2e

      - name: Run smoke test
        if: runner.os != 'Linux'
        run: bun run e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshot-${{ matrix.os }}
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  # A pull request no longer runs macOS or Windows, so main is where a
  # platform-specific failure surfaces. Main going red therefore has to be
  # visible without anyone opening the Actions tab. This job holds a single
  # latching issue: it opens one when a push to main fails, adds a comment
  # naming the failing jobs for each subsequent failure, and closes it when a
  # push to main is green again.
  main-status:
    name: main status
    needs:
      - matrix
      - release-metadata
      - rust
      - benchmarks
      - msrv
      - gitleaks
      - cargo-deny
      - javascript-audit
      - e2e
    if: ${{ always() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    env:
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_LABEL: broken-main
    steps:
      - name: Ensure the tracking label exists
        run: |
          set -euo pipefail
          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name \
            --jq '.[].name' | grep -qxF "$ISSUE_LABEL"; then
            gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" \
              --color b60205 \
              --description "CI on main is failing; the next release ships from a broken tree"
          fi

      - name: Report the failure
        if: ${{ env.FAILED == 'true' }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          {
            printf 'CI failed on `main` at %s.\n\n' "$GITHUB_SHA"
            printf 'Run: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Failing jobs:\n\n'
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"'
            printf '\nThe commit is on `main` already. Either fix it forward or revert it:'
            printf ' a release tagged from this tree ships the failure.\n'
          } > "$body"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI on main is failing" \
              --label "$ISSUE_LABEL" \
              --body-file "$body"
          fi

      - name: Close the notice once main is green
        if: ${{ env.FAILED != 'true' }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "CI on \`main\` is green again at $GITHUB_SHA."
          fi
