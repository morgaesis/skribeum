name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Intended release tag, such as v0.0.7
        required: true
        type: string
      changelog_section:
        description: Optional raw changelog section body; overrides tag lookup
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-notes-quality:
    name: release notes quality check
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate and validate candidate
        env:
          OPENROUTER_RELEASE_NOTES_KEY: ${{ secrets.OPENROUTER_RELEASE_NOTES_KEY }}
          RAW_CHANGELOG_SECTION: ${{ inputs.changelog_section }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          RELEASE_NOTES_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          section_arguments=()
          if [ -n "$RAW_CHANGELOG_SECTION" ]; then
            section="$RUNNER_TEMP/changelog-section.md"
            printf '%s\n' "$RAW_CHANGELOG_SECTION" > "$section"
            section_arguments=(--section-file "$section")
          fi
          python3 .github/scripts/release-notes.py \
            --changelog CHANGELOG.md \
            --tag "$RELEASE_NOTES_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$notes" \
            "${section_arguments[@]}"
          {
            echo "## Candidate release body"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-candidate
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: release notes
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.release-notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Build release notes
        id: release-notes
        env:
          OPENROUTER_RELEASE_NOTES_KEY: ${{ secrets.OPENROUTER_RELEASE_NOTES_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          python3 .github/scripts/release-notes.py \
            --changelog CHANGELOG.md \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$notes"
          delimiter="release_notes_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            cat "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    if: github.event_name == 'push'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            args: ""
          - name: windows-aarch64
            os: windows-11-arm
            # NSIS only: the WiX toolchain for arm64 MSIs is not reliable on
            # the hosted arm runners, and the NSIS installer covers arm64.
            args: --bundles nsis
          - name: linux-x86_64
            os: ubuntu-latest
            # Pinned by digest so the Linux build environment (and therefore
            # the glibc floor of the produced binaries) does not drift with
            # runner image updates.
            container: "debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc"
            # tauri invokes "<runner> build ..."; cargo-auditable must be
            # invoked as "cargo auditable", so the runner is a one-line shim
            # created below. It embeds dependency data in the binary for
            # auditing with cargo-audit.
            args: --runner cargo-auditable-runner
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            # The digest is the multi-arch manifest list, so the same pin
            # resolves to the arm64 image on this runner.
            container: "debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc"
            args: --runner cargo-auditable-runner
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Installed before checkout: without git in the container, checkout
      # falls back to a tarball download with no .git directory, which breaks
      # every subsequent git-aware step (including the package prepare hook).
      - name: Install build dependencies (container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config unzip wget xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf \
            xdg-utils

      - uses: actions/checkout@v7

      # The container user differs from the workspace owner, so git refuses
      # to operate on the checkout until the directory is marked safe.
      - name: Mark workspace safe for git (container)
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install rustup (container)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Add cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # No cargo cache here on purpose. A run triggered by a tag can restore
      # only entries written for the same tag or for the default branch, and
      # the default branch holds nothing this job could use: its cache keys
      # carry the CI job identifier, and the closest CI equivalent runs
      # `cargo check`, whose metadata a build cannot link. Every build leg
      # therefore starts cold, and a cache written here would be readable
      # only by a re-run of this same tag while consuming a repository cache
      # quota that the pull-request path depends on. See docs/ci.md.

      - name: Install cargo-auditable
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-auditable --locked
          printf '#!/bin/sh\nexec cargo auditable "$@"\n' > /usr/local/bin/cargo-auditable-runner
          chmod +x /usr/local/bin/cargo-auditable-runner

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build and attach to draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AppImage tooling cannot mount FUSE inside a container; run the
          # extracted tool instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Updater signing: artifacts gain detached signatures the promote
          # workflow assembles into the manifest the application polls.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Skribeum ${{ github.ref_name }}"
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: Preserve updater signatures for release finalization
        uses: actions/upload-artifact@v7
        with:
          name: updater-signatures-${{ matrix.name }}
          path: target/**/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 1

      # Attest the bundle files by glob rather than the action's artifactPaths
      # output: that output also lists directories (macOS .app), which cannot
      # be attestation subjects.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.rpm
            target/**/bundle/**/*.AppImage
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.app.tar.gz
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.exe

  sbom:
    name: sbom
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Generates an SPDX SBOM from Cargo.lock and bun.lock and uploads it as
      # a workflow artifact alongside the draft release.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: skribeum-sbom.spdx.json

  publish:
    name: publish release
    if: github.event_name == 'push'
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: updater-signatures-*
          path: ${{ runner.temp }}/updater-signatures
          merge-multiple: true

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Assemble and publish release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          release_directory="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_directory" \
            --pattern '*'
          python3 .github/scripts/bundle-signatures.py \
            --version "${GITHUB_REF_NAME#v}" \
            --directory "$RUNNER_TEMP/updater-signatures" \
            --output "$release_directory/updater-signatures.json"
          cd "$release_directory"
          mapfile -d '' assets < <(
            find . -maxdepth 1 -type f \
              ! -name CHECKSUM \
              ! -name CHECKSUM.sig \
              -printf '%f\0' | sort -z
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found; refusing to publish" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > CHECKSUM
          # The signer must be the workspace-pinned Tauri CLI: a bare bunx
          # from this temporary directory cannot see the workspace
          # node_modules and resolves a registry package by name instead.
          (cd "$GITHUB_WORKSPACE" && bun run tauri signer sign "$release_directory/CHECKSUM")
          # Tauri emits a base64-encoded Minisign document for updater
          # manifests. Release the decoded document for the Minisign CLI.
          base64 --decode CHECKSUM.sig > CHECKSUM.minisig
          mv CHECKSUM.minisig CHECKSUM.sig
          # The updater manifest is assembled here, from the signatures and
          # artifacts this job already holds, rather than by a later manual
          # step. Assembling it anywhere else lets a release publish and
          # reach nobody, with nothing saying so: three releases shipped
          # invisible that way. It stays out of CHECKSUM deliberately, since
          # its integrity comes from the per-artifact signatures it carries
          # and not from the manifest of the release it describes.
          python3 "$GITHUB_WORKSPACE/.github/scripts/build-manifest.py" \
            --version "${GITHUB_REF_NAME#v}" \
            --directory "$release_directory" \
            --signatures "$release_directory/updater-signatures.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --output "$release_directory/latest.json"
          gh release upload "$GITHUB_REF_NAME" \
            latest.json updater-signatures.json CHECKSUM CHECKSUM.sig \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          # The endpoint every shipped binary polls is a fixed URL, so the
          # same manifest lands there in the same act that publishes the
          # release it describes.
          gh release upload updater latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
