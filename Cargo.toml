[workspace]
resolver = "2"
members = [
  "crates/skribeum-core",
  "crates/skribeum-import",
  "crates/skribeum-vault",
  "src-tauri",
]
# The fuzz crate builds on its own pinned nightly (cargo-fuzz requires it);
# keeping it outside the workspace keeps every other build on exact stable.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/morgaesis/skribeum"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
