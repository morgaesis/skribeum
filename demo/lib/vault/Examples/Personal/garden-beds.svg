<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Top-down sketch of the garden beds, drainage channel, and bench">
  <rect width="320" height="200" fill="#f4f1ea"/>

  <!-- Upper bed -->
  <rect x="20" y="20" width="120" height="70" fill="#c9dcb0" stroke="#5a7a3f" stroke-width="2"/>
  <text x="80" y="55" font-family="sans-serif" font-size="12" fill="#3c5228" text-anchor="middle">Upper bed</text>

  <!-- Cedar planter -->
  <rect x="160" y="30" width="50" height="50" fill="#d9c19a" stroke="#8a6a3f" stroke-width="2"/>
  <text x="185" y="58" font-family="sans-serif" font-size="10" fill="#5c4526" text-anchor="middle">Cedar</text>
  <text x="185" y="70" font-family="sans-serif" font-size="10" fill="#5c4526" text-anchor="middle">planter</text>

  <!-- Drainage channel: a curved line from the upper bed toward the gravel edge -->
  <path d="M 110 90 Q 130 130 220 140 T 300 150" fill="none" stroke="#5a86a8" stroke-width="4" stroke-linecap="round"/>
  <text x="215" y="128" font-family="sans-serif" font-size="10" fill="#2f5266">Shallow channel</text>

  <!-- Gravel edge -->
  <rect x="270" y="140" width="40" height="50" fill="#d8d3c6" stroke="#948d78" stroke-width="2"/>
  <text x="290" y="168" font-family="sans-serif" font-size="9" fill="#5c5744" text-anchor="middle">Gravel</text>
  <text x="290" y="179" font-family="sans-serif" font-size="9" fill="#5c5744" text-anchor="middle">edge</text>

  <!-- Bench -->
  <rect x="20" y="150" width="60" height="16" fill="#a9835a" stroke="#6e5030" stroke-width="2"/>
  <text x="50" y="180" font-family="sans-serif" font-size="10" fill="#4a3520" text-anchor="middle">Bench</text>

  <!-- Chives marker -->
  <circle cx="120" cy="110" r="8" fill="#8fae5c" stroke="#4a6b2c" stroke-width="1.5"/>
  <text x="120" y="128" font-family="sans-serif" font-size="9" fill="#3c5228" text-anchor="middle">Chives</text>
</svg>
